# Application
spring.application.name=etl-importer

# Virtual Threads
spring.threads.virtual.enabled=true

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# SpringDoc OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ETL Import Performance
etl.import.partition.threads=4
etl.import.writer.strategy=jdbc-batch

# PostgreSQL JDBC Optimization
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# File Upload
etl.import.upload-dir=./uploads
etl.import.max-file-size=100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin
